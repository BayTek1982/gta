<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bayazit GTA-Schule</title>
<meta name="theme-color" content="#070b12">
<meta name="description" content="Lern-App über die Spielereihe Grand Theft Auto: Geschichte, Städte, Spielmechanik, Technik und Jugendschutz – mit kleinen Erklärvideos und Quiz.">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root,[data-theme="dark"]{
 --bg:#070b12;--panel:#0e1522;--panel2:#141d2e;--line:#1f2b40;--tx:#e6edf7;--mut:#8a99b3;
 --gold:#f5b301;--cyan:#22d3ee;--green:#22c55e;--violet:#a78bfa;--red:#f43f5e;--blue:#3b82f6;--pink:#f472b6;--orange:#fb923c;
 --water:#0b2740;--land:#17271d;--road:#2c3a52;--blk:#1a2436;--scene:#0a101b;--white:#ffffff;--ink:#0a0f18;
 --shadow:0 10px 30px rgba(0,0,0,.35);
}
[data-theme="light"]{
 --bg:#eef2f7;--panel:#ffffff;--panel2:#f2f5fa;--line:#d6deea;--tx:#0f172a;--mut:#56657f;
 --gold:#b7860b;--cyan:#0e8fae;--green:#15803d;--violet:#7c3aed;--red:#e11d48;--blue:#2563eb;--pink:#db2777;--orange:#ea580c;
 --water:#bfe0f5;--land:#d4e8cf;--road:#b6c1d1;--blk:#dfe6ef;--scene:#f8fafc;--white:#ffffff;--ink:#0a0f18;
 --shadow:0 8px 24px rgba(15,23,42,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{min-height:100%;background:var(--bg)}html,body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.mono{font-family:ui-monospace,"JetBrains Mono","SF Mono",Consolas,monospace}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
#app{display:flex;min-height:100vh}
#side{display:none}
main{flex:1;min-width:0;max-width:980px;margin:0 auto;padding:0 14px 40px}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 0 10px;background:linear-gradient(var(--bg) 75%,transparent)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1;cursor:pointer}
.logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--pink),var(--orange));color:#fff;font-weight:800;font-size:13px;flex:none}
.brand b{display:block;font-size:13px;letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;color:var(--mut);font-size:11px;white-space:nowrap}
.theme{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;flex:none}
.theme button{border:0;background:none;padding:5px 8px;border-radius:9px;font-size:12px;color:var(--mut);white-space:nowrap}
.theme button.on{background:var(--panel2);color:var(--tx);box-shadow:inset 0 0 0 1px var(--line)}
.theme button span{display:none}
@media(min-width:520px){.theme button span{display:inline}}
.hero{padding:6px 2px 14px}
.hero h1{font-size:24px;line-height:1.15;margin:4px 0 6px;letter-spacing:.02em}
.hero p{margin:0;color:var(--mut);font-size:14px}
.kicker{font-size:11px;letter-spacing:.16em;color:var(--pink);font-weight:700}
.prog{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--gold));border-radius:6px}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;overflow:hidden;border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:16px;min-height:170px;text-align:left;display:flex;flex-direction:column;box-shadow:var(--shadow);transition:transform .15s}
.tile:active{transform:scale(.98)}
.tile.big{grid-column:span 2;min-height:180px}
.tile::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--ac) 22%,transparent),transparent 60%);pointer-events:none}
.tile .ico{font-size:34px;line-height:1;margin-bottom:10px}
.tile .tag{font-size:10px;letter-spacing:.14em;color:var(--ac);font-weight:700}
.tile h3{margin:3px 0 4px;font-size:17px;line-height:1.2}
.tile p{margin:0;color:var(--mut);font-size:12.5px;line-height:1.4;flex:1}
.tile .bar{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:11px;color:var(--mut)}
.tile .bar span.t{flex:1;height:5px;border-radius:5px;background:var(--line);overflow:hidden}
.tile .bar span.t i{display:block;height:100%;background:var(--ac)}
.note{margin:14px 0 0;padding:12px 14px;border-radius:14px;border:1px dashed var(--line);color:var(--mut);font-size:12.5px}
.note b{color:var(--red)}
.back{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:7px 12px;font-size:13px;margin:4px 0 12px}
.ahead{border-radius:20px;padding:16px;border:1px solid var(--line);background:var(--panel);position:relative;overflow:hidden;margin-bottom:14px}
.ahead::before{content:"";position:absolute;inset:0;background:radial-gradient(100% 120% at 100% 0%,color-mix(in srgb,var(--ac) 25%,transparent),transparent 60%)}
.ahead *{position:relative}
.ahead .ico{font-size:36px}
.ahead h2{margin:6px 0 4px;font-size:21px}
.ahead p{margin:0;color:var(--mut);font-size:13.5px}
.list{display:grid;gap:10px}
@media(min-width:700px){.list{grid-template-columns:1fr 1fr}}
.lcard{display:flex;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:12px 14px}
.lcard .n{font-size:10px;letter-spacing:.14em;color:var(--ac);font-weight:700}
.lcard h4{margin:2px 0 2px;font-size:15px}
.lcard p{margin:0;color:var(--mut);font-size:12px}
.lcard .chk{margin-left:auto;flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);font-size:14px;color:var(--mut)}
.lcard.seen .chk{background:var(--ac);border-color:var(--ac);color:#fff}
.player{border:1px solid var(--line);background:var(--panel);border-radius:20px;overflow:hidden}
.stage{position:relative;background:var(--scene);aspect-ratio:360/220}
.stage svg{display:block;width:100%;height:100%}
.ctrl{padding:10px 12px 12px;border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:8px}
.pbtn{border:1px solid var(--line);background:var(--panel2);border-radius:10px;min-width:38px;height:34px;padding:0 10px;font-size:13px}
.pbtn.main{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
input[type=range]{flex:1;accent-color:var(--ac);min-width:60px}
.speeds{display:flex;gap:4px}
.speeds .pbtn{min-width:0;padding:0 8px;font-size:12px}
.speeds .pbtn.on{background:color-mix(in srgb,var(--ac) 25%,var(--panel2));border-color:var(--ac)}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.steps button{width:34px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);font-size:12px}
.steps button.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
.steps button.done{border-color:var(--ac)}
.stxt{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);min-height:76px}
.stxt .k{font-size:10.5px;letter-spacing:.14em;color:var(--ac);font-weight:700}
.stxt p{margin:4px 0 0;font-size:14.5px}
.info{display:grid;gap:10px;margin-top:14px}
@media(min-width:700px){.info{grid-template-columns:1fr 1fr}}
.ibox{border-radius:16px;padding:12px 14px;border:1px solid color-mix(in srgb,var(--c) 45%,var(--line));background:color-mix(in srgb,var(--c) 9%,var(--panel))}
.ibox b{display:block;font-size:11px;letter-spacing:.12em;color:var(--c);margin-bottom:4px}
.ibox p{margin:0;font-size:13.5px}
.nav2{display:flex;gap:10px;margin-top:16px}
.nav2 button{flex:1;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:12px;font-size:13px;text-align:left}
.nav2 button small{display:block;color:var(--mut);font-size:11px}
.nav2 button.r{text-align:right}
.nav2 button:disabled{opacity:.35}
.lh{margin:0 0 10px}
.lh .n{font-size:11px;letter-spacing:.14em;color:var(--ac);font-weight:700}
.lh h2{margin:3px 0 0;font-size:20px;line-height:1.2}
/* Quiz */
.qcard{border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:16px}
.qtop{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-bottom:8px}
.qcard h3{margin:4px 0 12px;font-size:17px;line-height:1.35}
.qimg{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--scene);margin-bottom:12px;aspect-ratio:360/220}
.qimg svg{display:block;width:100%;height:100%}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:11px 13px;font-size:14px}
.opt.ok{border-color:var(--green);background:color-mix(in srgb,var(--green) 18%,var(--panel2))}
.opt.no{border-color:var(--red);background:color-mix(in srgb,var(--red) 16%,var(--panel2))}
.fb{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);font-size:13.5px}
.fb b.ok{color:var(--green)}.fb b.no{color:var(--red)}
.qbtns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.qbtns button{flex:1;min-width:140px;border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:11px;font-size:13.5px}
.qbtns button.main{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
.score{font-size:46px;font-weight:800;margin:6px 0}
.rep{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.rep li button{width:100%;text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:9px 12px;font-size:13px}
footer{margin-top:26px;color:var(--mut);font-size:11.5px;text-align:center}
/* Desktop */
@media(min-width:1000px){
 #side{display:block;width:290px;flex:none;border-right:1px solid var(--line);background:var(--panel);height:100vh;position:sticky;top:0;overflow:auto;padding:16px 14px}
 #side input{width:100%;border:1px solid var(--line);background:var(--panel2);color:var(--tx);border-radius:12px;padding:9px 12px;font:inherit;font-size:13px;margin:10px 0 12px}
 #side .sg{font-size:10.5px;letter-spacing:.14em;font-weight:700;margin:14px 4px 6px}
 #side button.si{display:flex;gap:8px;width:100%;text-align:left;border:0;background:none;border-radius:10px;padding:7px 8px;font-size:13px;color:var(--tx)}
 #side button.si:hover,#side button.si.on{background:var(--panel2)}
 #side button.si .d{color:var(--mut);margin-left:auto}
 main{padding:0 28px 40px}
 .bento{grid-template-columns:repeat(3,1fr)}
 .tile.big{grid-column:span 2}
}
</style>
</head>
<body>
<div id="app">
 <aside id="side"></aside>
 <main>
  <header class="top">
   <div class="brand" onclick="go('#start')"><div class="logo mono">GTA</div><div><b class="mono">BAYAZIT GTA-SCHULE</b><small>Grand Theft Auto verstehen</small></div></div>
   <div class="theme" id="theme">
    <button data-m="dark" title="Dunkel">☾<span> Dunkel</span></button>
    <button data-m="light" title="Hell">☀<span> Hell</span></button>
    <button data-m="auto" title="Automatisch">◐<span> Auto</span></button>
   </div>
  </header>
  <div id="view"></div>
  <footer>Bayazit GTA-Schule · Lern-App über eine Spielereihe · „Grand Theft Auto“ ist eine Marke von Take-Two Interactive / Rockstar Games – diese App ist ein inoffizielles Lernprojekt.</footer>
 </main>
</div>
<script>
"use strict";
/* ---------- Speicher ---------- */
const store={get(k,d){try{const v=localStorage.getItem("gta_"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("gta_"+k,JSON.stringify(v))}catch(e){}}};
/* ---------- Theme ---------- */
const mq=window.matchMedia?matchMedia("(prefers-color-scheme: light)"):null;
function applyTheme(){const m=store.get("theme","dark");const t=m==="auto"?(mq&&mq.matches?"light":"dark"):m;document.documentElement.setAttribute("data-theme",t);
 document.querySelectorAll("#theme button").forEach(b=>b.classList.toggle("on",b.dataset.m===m));
 const mc=document.querySelector('meta[name=theme-color]');if(mc)mc.content=t==="light"?"#eef2f7":"#070b12";}
document.querySelectorAll("#theme button").forEach(b=>b.onclick=()=>{store.set("theme",b.dataset.m);applyTheme()});
if(mq&&mq.addEventListener)mq.addEventListener("change",applyTheme);
applyTheme();

/* ---------- Szenen-Bausteine ---------- */
const D=4.5; // Sekunden pro Schritt
const R=(s,x,y,w,h,c,o,x2)=>Object.assign({t:"rect",s,x,y,w,h,c,o},x2||{});
const P=(s,x,y,txt,c,x2)=>Object.assign({t:"pill",s,x,y,txt,c},x2||{});
const T=(s,x,y,txt,c,size,x2)=>Object.assign({t:"txt",s,x,y,txt,c,size},x2||{});
const A=(s,x1,y1,x2,y2,c,x3)=>Object.assign({t:"arrow",s,x1,y1,x2,y2,c},x3||{});
const Ln=(s,x1,y1,x2,y2,c,x3)=>Object.assign({t:"line",s,x1,y1,x2,y2,c},x3||{});
const C=(s,x,y,r,c,o,x2)=>Object.assign({t:"circ",s,x,y,r,c,o},x2||{});
const G=(s,pts,c,o,x2)=>Object.assign({t:"poly",s,pts,c,o},x2||{});
const E=(s,x,y,txt,size,x2)=>Object.assign({t:"emo",s,x,y,txt,size},x2||{});
const B=(s,x,y,w,h,c,x2)=>Object.assign({t:"bar",s,x,y,w,h,c},x2||{});
const HB=(s,x,y,w,h,c,x2)=>Object.assign({t:"hbar",s,x,y,w,h,c},x2||{});
const ST=(s,x,y,r,c,fill,x2)=>Object.assign({t:"star",s,x,y,r,c,fill},x2||{});
const CAR=(s,pts,c,dur,x2)=>Object.assign({t:"car",s,pts,c,dur},x2||{});
const RING=(s,x,y,r,c,x2)=>Object.assign({t:"ring",s,x,y,r,c},x2||{});
const PATH=(s,pd,c,x2)=>Object.assign({t:"path",s,pd,c},x2||{});
function box3d(s,x,y,w,h,dp,c,del){const o={d:del||0};return[
 G(s,`${x},${y} ${x+w},${y} ${x+w},${y-h} ${x},${y-h}`,c,.85,o),
 G(s,`${x},${y-h} ${x+dp},${y-h-dp*.6} ${x+w+dp},${y-h-dp*.6} ${x+w},${y-h}`,c,.55,o),
 G(s,`${x+w},${y} ${x+w+dp},${y-dp*.6} ${x+w+dp},${y-h-dp*.6} ${x+w},${y-h}`,c,.35,o)]}
function cityGrid(s,x0,y0,n,b,g){const a=[R(s,x0,y0,n*b+(n+1)*g,n*b+(n+1)*g,"road",1,{r:6})];for(let i=0;i<n;i++)for(let j=0;j<n;j++)a.push(R(s,x0+g+i*(b+g),y0+g+j*(b+g),b,b,"blk",1,{r:3,d:.05*(i+j)}));return a}
function carShape(x,y,c,dmg){return `<g transform="translate(${x},${y})"><rect x="-26" y="-12" width="52" height="14" rx="4" style="fill:${col(c)}"/>`+
 (dmg?`<polygon points="26,-12 18,-6 26,2" style="fill:var(--scene)"/>`:"")+
 `<path d="M-14,-12 L-8,-22 L10,-22 L16,-12 Z" style="fill:${col(c)};opacity:.8"/><circle cx="-14" cy="3" r="5" style="fill:var(--tx)"/><circle cx="14" cy="3" r="5" style="fill:var(--tx)"/></g>`}

/* ---------- Bereiche ---------- */
const AREAS=[
 {id:"geschichte",name:"Geschichte der Reihe",icon:"🕹️",c:"gold",desc:"Von 1997 bis GTA VI: wie aus einem kleinen 2D-Spiel die erfolgreichste Spielereihe wurde."},
 {id:"staedte",name:"Städte & Welten",icon:"🌆",c:"cyan",desc:"Liberty City, Vice City, San Andreas, Los Santos, Leonida – und ihre echten Vorbilder."},
 {id:"spiel",name:"Spielmechanik",icon:"⭐",c:"green",desc:"Offene Welt, Fahndungssterne, Missionen, Fahrzeuge und Radio – so funktioniert ein GTA."},
 {id:"technik",name:"Technik & Entwicklung",icon:"⚙️",c:"violet",desc:"Rockstar Games, die RAGE-Engine, Streaming, Motion-Capture und Rekordzahlen."},
 {id:"jugend",name:"Jugendschutz & Gesellschaft",icon:"🛡️",c:"red",desc:"USK 18, Satire, Kontroversen, Forschung – und wie man gesund spielt."},
 {id:"ableger",name:"Ableger & Neuauflagen",icon:"📀",c:"orange",desc:"London 1969, die Handheld-Teile, die GTA-IV-Episoden, Neuauflagen und die Definitive Edition.",neu:1},
 {id:"online",name:"GTA Online",icon:"🌐",c:"blue",desc:"Mehrspieler seit 2013: Sitzungen, Heists, Spielgeld, Shark Cards, Updates und GTA+.",neu:1}
];

/* ---------- Lektionen ---------- */
const L=[
/* ===== GESCHICHTE ===== */
{id:"g1",a:"geschichte",title:"Die Anfänge 1997",sub:"DMA Design, Top-Down und GTA 2",
 steps:["1997 erscheint Grand Theft Auto – entwickelt vom kleinen Studio DMA Design aus Dundee in Schottland.",
 "Die Kamera schaut senkrecht von oben auf die Stadt. Diese Ansicht heißt „Top-Down“ – alles ist noch 2D.",
 "Ursprünglich hieß das Projekt „Race'n'Chase“: Man sollte als Polizist Verbrecher jagen. Im Test machte die Rolle des Gejagten mehr Spaß.",
 "Schon im ersten Teil gibt es die drei Städte Liberty City, San Andreas und Vice City – und ein Fahndungssystem.",
 "1999 folgt GTA 2: Gangs teilen die Stadt unter sich auf, und je nach Respekt sind sie dir freundlich oder feindlich gesinnt."],
 els:[...cityGrid(0,14,30,3,44,12),
 T(0,270,52,"1997","gold",32,{b:1,m:1}),P(0,270,78,"DMA Design · Dundee","gold"),
 P(1,99,16,"TOP-DOWN · 2D","cyan"),CAR(1,[[20,86],[126,86],[126,195],[20,195]],"pink",7,{sc:.45,loop:1}),
 P(2,270,106,"Race'n'Chase","blue"),T(2,270,124,"erster Projektname","mut",9),CAR(2,[[20,86],[126,86],[126,195],[20,195]],"blue",7,{sc:.45,loop:1,lag:.9}),
 P(3,270,148,"Liberty City","cyan",{e:4}),P(3,270,170,"San Andreas","green",{e:4,d:.3}),P(3,270,192,"Vice City","pink",{e:4,d:.6}),
 R(4,20,36,100,44,"red",.35,{r:3}),R(4,76,92,100,44,"green",.35,{r:3,d:.2}),R(4,20,148,44,44,"violet",.4,{r:3,d:.4}),
 T(4,270,156,"GTA 2 · 1999","pink",14,{b:1,m:1}),P(4,270,180,"Gangs & Respekt","pink")],
 info:{was:"Grand Theft Auto (1997) war ein 2D-Actionspiel mit Draufsicht. Man klaut Autos, erledigt Aufträge und flieht vor der Polizei.",
 so:"Top-Down-Kamera, kleine Pixel-Autos, Aufträge über Telefonzellen – und ein Fahndungslevel, das bei Regelverstößen steigt.",
 bed:"Aus einem Polizei-Spiel wurde durch Testen ein Spiel über den Gejagten – so entstand die Grundidee der ganzen Reihe.",
 tipp:"DMA Design ist das Studio, aus dem später Rockstar North wurde. Die Wurzeln von GTA liegen also in Schottland."}},
{id:"g2",a:"geschichte",title:"GTA III – der Sprung in 3D",sub:"2001: die Open-World-Revolution",
 steps:["Bis 2000 war GTA flach: eine 2D-Karte, von oben betrachtet.",
 "2001 wird die Stadt in GTA III zum ersten Mal komplett dreidimensional – man läuft und fährt mitten durch die Straßen.",
 "Das Spiel erscheint im Oktober 2001 für die PlayStation 2 und wird ein Riesenerfolg.",
 "Schauplatz ist Liberty City, angelehnt an New York. Der Held heißt Claude und spricht kein einziges Wort.",
 "GTA III gilt als Vorbild für viele spätere Open-World-Spiele: eine große Stadt, in der man frei entscheidet, was man tut."],
 els:[R(0,30,60,100,100,"road",1,{r:6}),R(0,38,68,38,38,"blk",1),R(0,84,68,38,38,"blk",1),R(0,38,114,38,38,"blk",1),R(0,84,114,38,38,"blk",1),T(0,80,48,"2D von oben","mut",10,{b:1}),
 A(1,140,110,186,110,"gold"),...box3d(1,200,170,30,70,14,"cyan",.1),...box3d(1,244,170,26,100,12,"blue",.3),...box3d(1,282,170,32,55,14,"violet",.5),...box3d(1,322,170,20,85,10,"pink",.7),
 P(1,275,30,"3D-Welt","gold"),
 P(2,180,205,"PlayStation 2 · Oktober 2001","blue"),
 P(3,80,180,"Liberty City ≈ New York","cyan"),
 RING(4,268,120,70,"gold"),P(4,275,8,"Vorbild für Open World","green")],
 info:{was:"GTA III (2001) ist der erste Teil der Reihe mit einer vollständig dreidimensionalen Stadt.",
 so:"Freie Kamera hinter der Figur, Autos mit Radiosendern, Missionen bei verschiedenen Auftraggebern – alles in einer zusammenhängenden Stadt.",
 bed:"Der Sprung in 3D machte GTA weltberühmt. Viele Spiele mit offener Welt bauen bis heute auf diesem Prinzip auf.",

 "Zum ersten Mal gibt es drei Hauptfiguren – Michael, Franklin und Trevor. Man kann jederzeit zwischen ihnen wechseln.",
 "GTA V hat laut Take-Two inzwischen über 230 Millionen Exemplare verkauft. Schon in den ersten 3 Tagen nahm es 1 Milliarde US-Dollar ein.",
 "Dazu kam GTA Online – ein Mehrspieler-Modus, der seit 2013 immer weiter ausgebaut wird."],

 "Dazu kommt Euphoria: Figuren reagieren physikalisch, stolpern, fangen sich ab – statt immer gleiche Animationen abzuspielen.",

 "Ganz weit weg: nur grobe Umrisse und Lichter. Diese Technik heißt LOD (Level of Detail).",

/* ---------- Player ---------- */
let player=null;
function stopPlayer(){if(player){cancelAnimationFrame(player.raf);player=null}}
function startPlayer(les){stopPlayer();const n=les.steps.length,total=n*D;
 const pl={les,t:0,playing:true,speed:store.get("speed",1),last:performance.now(),step:-1,total,raf:0};player=pl;
 const svg=$("#svg"),rng=$("#rng"),pbtn=$("#pp");
 function setStep(i){if(i===pl.step)return;pl.step=i;$("#sk").textContent=`SCHRITT ${i+1} / ${n}`;$("#st").textContent=les.steps[i];
  document.querySelectorAll(".steps button").forEach((b,k)=>{b.classList.toggle("on",k===i);b.classList.toggle("done",k<i)})}
 function frame(now){if(player!==pl)return;const dt=Math.min(.1,(now-pl.last)/1000);pl.last=now;
  if(pl.playing){pl.t+=dt*pl.speed;if(pl.t>=total){pl.t=total;pl.playing=false;pbtn.textContent="▶"}}
  const sh=Math.min(pl.t,total-.001);svg.innerHTML=renderScene(les.els,pl.t);rng.value=Math.round(sh/total*1000);
  setStep(Math.min(n-1,Math.floor(sh/D)));pl.raf=requestAnimationFrame(frame)}
 pbtn.onclick=()=>{if(pl.t>=total)pl.t=0;pl.playing=!pl.playing;pbtn.textContent=pl.playing?"❚❚":"▶"};
 $("#rs").onclick=()=>{pl.t=0;pl.playing=true;pbtn.textContent="❚❚"};
 rng.oninput=()=>{pl.t=rng.value/1000*total;};
 document.querySelectorAll(".speeds .pbtn").forEach(b=>{b.classList.toggle("on",+b.dataset.s===pl.speed);b.onclick=()=>{pl.speed=+b.dataset.s;store.set("speed",pl.speed);document.querySelectorAll(".speeds .pbtn").forEach(x=>x.classList.toggle("on",x===b))}});
 document.querySelectorAll(".steps button").forEach((b,k)=>b.onclick=()=>{pl.t=k*D+.01;pl.playing=true;pbtn.textContent="❚❚"});
 pbtn.textContent="❚❚";pl.raf=requestAnimationFrame(frame)}

/* ---------- Ansichten ---------- */
function progArea(aid){const ls=L.filter(l=>l.a===aid),s=seen();return[ls.filter(l=>s[l.id]).length,ls.length]}
function viewHome(){const s=seen(),done=L.filter(l=>s[l.id]).length,best=store.get("best",null);
 let h=`<section class="hero"><div class="kicker mono">LERN-APP · ${L.length} LEKTIONEN</div><h1 class="mono">GTA verstehen</h1>
 <p>Geschichte, Städte, Spielmechanik, Technik, Ableger, GTA Online und Jugendschutz der Spielereihe Grand Theft Auto – erklärt mit kleinen Videos.</p>
 <div class="prog"><i style="width:${done/L.length*100}%"></i></div><p style="margin-top:6px;font-size:12px">${done} von ${L.length} Lektionen gesehen</p></section><div class="bento">`;
 AREAS.forEach((a,i)=>{const[d,n]=progArea(a.id);h+=`<button class="tile ${i===0?"big":""}" style="--ac:${col(a.c)}" onclick="go('#b-${a.id}')">
  <div class="ico">${a.icon}</div><div class="tag mono">BEREICH ${i+1}${a.neu?" · NEU":""}</div><h3>${a.name}</h3><p>${a.desc}</p>
  <div class="bar"><span class="t"><i style="width:${d/n*100}%"></i></span><span class="mono">${d}/${n}</span></div></button>`});
 h+=`<button class="tile big" style="--ac:var(--pink)" onclick="go('#quiz')"><div class="ico">🎯</div><div class="tag mono">QUIZ</div><h3>Teste dein Wissen</h3>
 <p>10 zufällige Fragen – mit Bilderfragen und Rechenaufgaben.</p><div class="bar"><span class="mono">Bestwert: ${best==null?"–":best+" / 10"}</span></div></button></div>
 <div class="note"><b>Hinweis:</b> Die GTA-Spiele selbst haben in Deutschland „USK ab 18“. Diese App erklärt Geschichte, Technik und Hintergründe – ohne Spielszenen.</div>`;
 return h}
function viewArea(aid){const a=area(aid);if(!a)return viewHome();const ls=L.filter(l=>l.a===aid),s=seen();
 let h=`<button class="back" onclick="go('#start')">← Startseite</button><div class="ahead" style="--ac:${col(a.c)}"><div class="ico">${a.icon}</div><h2>${a.name}</h2><p>${a.desc}</p></div><div class="list">`;
 ls.forEach((l,i)=>{h+=`<button class="lcard ${s[l.id]?"seen":""}" style="--ac:${col(a.c)}" onclick="go('#l-${l.id}')"><div><div class="n mono">LEKTION ${i+1}</div><h4>${l.title}</h4><p>${l.sub}</p></div><span class="chk">${s[l.id]?"✓":"▶"}</span></button>`});
 return h+"</div>"}
function viewLesson(id){const l=L.find(x=>x.id===id);if(!l)return viewHome();const a=area(l.a);markSeen(id);const ls=L.filter(x=>x.a===l.a),i=ls.indexOf(l);
 const gi=L.indexOf(l),prev=L[gi-1],next=L[gi+1];
 return `<div style="--ac:${col(a.c)}"><button class="back" onclick="go('#b-${a.id}')">← ${a.name}</button>
 <div class="lh"><div class="n mono">${a.icon} LEKTION ${i+1} / ${ls.length}</div><h2>${l.title}</h2></div>
 <div class="player"><div class="stage"><svg id="svg" viewBox="0 0 360 220" xmlns="http://www.w3.org/2000/svg"></svg></div>
 <div class="ctrl"><div class="row"><button class="pbtn main" id="pp" aria-label="Abspielen/Pause">❚❚</button><input type="range" id="rng" min="0" max="1000" value="0" aria-label="Spulen"><button class="pbtn" id="rs" aria-label="Neustart">↺</button></div>
 <div class="row" style="margin-top:8px;justify-content:space-between"><div class="speeds"><button class="pbtn" data-s="0.5">½×</button><button class="pbtn" data-s="1">1×</button><button class="pbtn" data-s="2">2×</button></div><span class="mono" style="font-size:11px;color:var(--mut)">Schritte</span></div>
 <div class="steps">${l.steps.map((_,k)=>`<button>${k+1}</button>`).join("")}</div></div></div>
 <div class="stxt"><div class="k mono" id="sk">SCHRITT 1 / ${l.steps.length}</div><p id="st">${l.steps[0]}</p></div>
 <div class="info"><div class="ibox" style="--c:var(--blue)"><b class="mono">WAS IST DAS?</b><p>${l.info.was}</p></div>
 <div class="ibox" style="--c:var(--green)"><b class="mono">SO ERKENNST DU ES</b><p>${l.info.so}</p></div>
 <div class="ibox" style="--c:var(--gold)"><b class="mono">WAS BEDEUTET ES?</b><p>${l.info.bed}</p></div>
 <div class="ibox" style="--c:var(--red)"><b class="mono">TIPP</b><p>${l.info.tipp}</p></div></div>
 <div class="nav2"><button ${prev?"":"disabled"} onclick="go('#l-${prev?prev.id:""}')"><small>← Zurück</small>${prev?prev.title:"–"}</button>
 <button class="r" ${next?"":"disabled"} onclick="go('#l-${next?next.id:""}')"><small>Weiter →</small>${next?next.title:"–"}</button></div></div>`}

/* ---------- Quiz ---------- */
let quiz=null;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function newQuiz(){quiz={qs:shuffle(Q).slice(0,10).map(q=>({...q,opts:shuffle(q.a.map((t,i)=>({t,ok:i===0})))})),i:0,pts:0,wrong:[],answered:false}}
function viewQuiz(){if(!quiz)newQuiz();const z=quiz;
 if(z.i>=z.qs.length){const best=Math.max(store.get("best",0)||0,z.pts);store.set("best",best);
  const rep=[...new Set(z.wrong)].map(id=>L.find(l=>l.id===id));
  return `<div style="--ac:var(--pink)"><button class="back" onclick="go('#start')">← Startseite</button><div class="qcard" style="text-align:center">
  <div class="kicker mono">ERGEBNIS</div><div class="score mono">${z.pts} / 10</div><p style="color:var(--mut);margin:0">Bestwert: ${best} / 10</p>
  ${rep.length?`<p style="margin:16px 0 0;text-align:left;font-weight:700">Diese Lektionen solltest du wiederholen:</p><ul class="rep">${rep.map(l=>`<li><button onclick="go('#l-${l.id}')">${area(l.a).icon} ${l.title}</button></li>`).join("")}</ul>`:`<p style="margin-top:14px">Alles richtig – stark! 🏆</p>`}
  <div class="qbtns"><button class="main" onclick="newQuiz();route()">Neues Quiz</button><button onclick="go('#start')">Zur Startseite</button></div></div></div>`}
 const q=z.qs[z.i];const img=q.img?L.find(l=>l.id===q.img):null;
 return `<div style="--ac:var(--pink)"><button class="back" onclick="go('#start')">← Startseite</button><div class="qcard">
 <div class="qtop mono"><span>FRAGE ${z.i+1} / 10</span><span>Punkte: ${z.pts}</span></div><div class="prog" style="margin:0 0 10px"><i style="width:${z.i*10}%"></i></div>
 ${img?`<div class="qimg">${svgWrap(renderScene(img.els.filter(e=>e.e==null),99))}</div>`:""}
 <h3>${q.q}</h3><div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}">${o.t}</button>`).join("")}</div><div id="fb"></div></div></div>`}
function bindQuiz(){const z=quiz;if(!z||z.i>=z.qs.length)return;const q=z.qs[z.i];
 document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(z.answered)return;z.answered=true;const o=q.opts[+b.dataset.k];
  if(o.ok)z.pts++;else z.wrong.push(q.l);
  document.querySelectorAll(".opt").forEach((x,k)=>{if(q.opts[k].ok)x.classList.add("ok");else if(x===b)x.classList.add("no")});
  const l=L.find(x=>x.id===q.l);
  $("#fb").innerHTML=`<div class="fb"><b class="${o.ok?"ok":"no"}">${o.ok?"✓ Richtig!":"✗ Leider falsch."}</b> ${q.ex}</div>
  <div class="qbtns"><button onclick="go('#l-${l.id}')">📖 Zur Lektion</button><button class="main" id="nx">${z.i<9?"Nächste Frage →":"Ergebnis anzeigen"}</button></div>`;
  $("#nx").onclick=()=>{z.i++;z.answered=false;route();window.scrollTo(0,0)}})}

/* ---------- Seitenleiste (PC) ---------- */
function renderSide(cur){const s=seen(),qv=(store._q||"").toLowerCase();
 let h=`<div class="brand" onclick="go('#start')"><div class="logo mono">GTA</div><div><b class="mono">GTA-SCHULE</b><small>${L.filter(l=>s[l.id]).length}/${L.length} gesehen</small></div></div>
 <input id="sq" placeholder="🔍 Lektion suchen …" value="${esc(store._q||"")}">`;
 AREAS.forEach(a=>{const ls=L.filter(l=>l.a===a.id&&(!qv||(l.title+" "+l.sub+" "+l.steps.join(" ")).toLowerCase().includes(qv)));if(!ls.length)return;
  h+=`<div class="sg mono" style="color:${col(a.c)}">${a.icon} ${a.name.toUpperCase()}</div>`;
  ls.forEach(l=>h+=`<button class="si ${cur===l.id?"on":""}" onclick="go('#l-${l.id}')">${l.title}<span class="d">${s[l.id]?"✓":""}</span></button>`)});
 h+=`<div class="sg mono" style="color:var(--pink)">🎯 QUIZ</div><button class="si ${cur==="quiz"?"on":""}" onclick="go('#quiz')">10 Fragen starten</button>`;
 $("#side").innerHTML=h;const inp=$("#sq");inp.oninput=()=>{store._q=inp.value;const pos=inp.selectionStart;renderSide(cur);const n=$("#sq");n.focus();n.setSelectionRange(pos,pos)}}

/* ---------- Routing ---------- */
function route(){stopPlayer();const h=location.hash||"#start";const m=h.slice(1);let cur="";
 const v=$("#view");
 if(m.startsWith("b-")){v.innerHTML=viewArea(m.slice(2))}
 else if(m.startsWith("l-")){const id=m.slice(2);v.innerHTML=viewLesson(id);cur=id;const l=L.find(x=>x.id===id);if(l)startPlayer(l)}
 else if(m==="quiz"){v.innerHTML=viewQuiz();bindQuiz();cur="quiz"}
 else v.innerHTML=viewHome();
 renderSide(cur);if(route._last!==h)window.scrollTo(0,0);route._last=h}
window.addEventListener("hashchange",()=>{if(location.hash==="#quiz"&&quiz&&quiz.i>=quiz.qs.length)newQuiz();route()});
route();
if("serviceWorker"in navigator&&location.protocol==="https:"&&!/claude|anthropic|usercontent/.test(location.host)){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
</body>
</html>
